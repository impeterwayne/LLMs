<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com http://localhost:4100;" />
  <title>Multi-LLM Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;

      /* ── Surface palette ── */
      --bg: #0e0e10;
      --surface: #18181b;
      --surface-high: #1f1f23;
      --surface-variant: #27272a;

      /* ── Text ── */
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;

      /* ── Accent ── */
      --accent: #8ab4f8;
      --accent-hover: #6ea3f7;
      --accent-dim: rgba(138, 180, 248, 0.12);
      --accent-glow: rgba(138, 180, 248, 0.20);

      /* ── Borders ── */
      --border: #27272a;
      --border-subtle: rgba(255, 255, 255, 0.06);

      /* ── Radii ── */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;

      /* ── Layout ── */
      --app-viewport-height: 1vh;
      --sidebar-width: 280px;
      --sidebar-max: 280px;
      --sessions-button-size: 36px;
      --sessions-header-pad: 8px;
      --sidebar-rail: calc(var(--sessions-button-size) + (2 * var(--sessions-header-pad)));
      --header-height: 44px;

      /* ── Typography ── */
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
      min-height: 100vh;
      padding: 0;
      background: var(--bg);
      font-family: var(--font);
      color: var(--text-primary);
      transition: justify-content 0.2s ease;
      overflow: hidden;
    }

    body.is-overflowing {
      justify-content: flex-start;
    }

    @supports (height: 100dvh) {
      body {
        min-height: 100dvh;
        min-height: calc(var(--app-viewport-height) * 100);
      }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Provider Toggles ── */
    .provider-toggle {
      flex: 1;
      min-height: 36px;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .provider-toggle.active {
      color: var(--text-primary);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .provider-toggle:hover {
      color: var(--text-secondary);
      border-color: var(--text-muted);
    }

    .provider-toggle.active:hover {
      color: var(--text-primary);
      border-color: var(--accent);
    }

    /* Research provider accent */
    .provider-toggle.provider-research.active {
      border-color: #34a853;
      background: rgba(52, 168, 83, 0.10);
    }

    .provider-toggle.provider-research:hover {
      border-color: rgba(52, 168, 83, 0.5);
    }

    .provider-toggle svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* Provider divider */
    .provider-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
      align-self: center;
    }

    /* ── Prompt Area ── */
    #prompt-area {
      position: fixed;
      left: min(var(--sidebar-width, 280px), var(--sidebar-max, 280px));
      right: 0;
      bottom: 0;
      display: flex;
      gap: 10px;
      padding: 12px;
      min-height: 110px;
      align-items: stretch;
      width: auto;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-direction: column;
    }

    #prompt-area.drag-active {
      border-color: var(--accent);
      background: linear-gradient(135deg,
          var(--accent-dim),
          transparent);
    }

    #prompt-input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      font-family: var(--font);
      line-height: 1.6;
      background: var(--surface-high);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      resize: none;
      transition: border-color 0.15s;
    }

    #prompt-input::placeholder {
      color: var(--text-muted);
    }

    #prompt-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ── Button Group ── */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 180px;
    }

    .dropdown,
    .prompt-picker {
      width: 100%;
      position: relative;
    }

    button {
      font-family: inherit;
    }

    #dropdown-button,
    .utility-button {
      width: 100%;
      min-height: 40px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-high);
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      text-align: center;
    }

    #dropdown-button:hover,
    .utility-button:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .utility-button {
      background: var(--accent);
      color: var(--bg);
      border-color: transparent;
      font-weight: 600;
    }

    .utility-button:hover {
      background: var(--accent-hover);
      color: var(--bg);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      background-color: var(--surface-high);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 6px;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1000;
    }

    .dropdown-item {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      color: var(--text-secondary);
      transition: background-color 0.12s, color 0.12s;
    }

    .dropdown-item:hover {
      background-color: var(--accent-dim);
      color: var(--text-primary);
    }

    .show {
      display: block;
    }

    /* ── Chat Header ── */
    .chat-header {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 4px;
    }

    /* ── Chat Input Row ── */
    .chat-input-row {
      display: flex;
      gap: 8px;
      align-items: stretch;
    }

    .chat-input-actions {
      display: flex;
      flex-direction: column;
      gap: 4px;
      justify-content: center;
    }

    /* ── Send Button ── */
    #send-prompt-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, transform 0.1s;
    }

    #send-prompt-btn:hover {
      background: var(--accent-hover);
    }

    #send-prompt-btn:active {
      transform: scale(0.92);
    }

    #send-prompt-btn svg {
      width: 18px;
      height: 18px;
    }

    /* ── Prompt Icon Button (generic) ── */
    .prompt-icon-btn {
      width: 40px;
      height: 40px;
      flex-shrink: 0;
      border: none;
      border-radius: var(--radius-sm);
      background: var(--accent);
      color: var(--bg);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.15s, color 0.15s, transform 0.1s;
    }

    .prompt-icon-btn:hover {
      background: var(--accent-hover);
    }

    .prompt-icon-btn:active {
      transform: scale(0.92);
    }

    .prompt-icon-btn.copied {
      border-color: #34a853;
      color: #34a853;
    }

    .prompt-icon-btn:disabled {
      cursor: default;
      opacity: 0.7;
      pointer-events: none;
    }

    .prompt-icon-btn.loading svg {
      animation: spin 0.8s linear infinite;
    }

    @keyframes spin {
      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }
    }

    .prompt-icon-btn svg {
      width: 16px;
      height: 16px;
    }

    /* ── Toast ── */
    #toast-container {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      z-index: 100;
      pointer-events: none;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      padding-bottom: 8px;
    }

    .toast {
      padding: 8px 16px;
      border-radius: 8px;
      background: var(--surface-high);
      border: 1px solid var(--border);
      color: var(--text-primary);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      box-shadow: 0 4px 16px rgba(0, 0, 0, 0.4);
      opacity: 0;
      transform: translateY(12px);
      animation: toastIn 0.2s ease forwards;
      white-space: nowrap;
    }

    .toast.success {
      border-color: #34a853;
      color: #34a853;
    }

    .toast.error {
      border-color: #ea4335;
      color: #ea4335;
    }

    .toast.fade-out {
      animation: toastOut 0.25s ease forwards;
    }

    @keyframes toastIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    @keyframes toastOut {
      to {
        opacity: 0;
        transform: translateY(-8px);
      }
    }

    /* ── Sessions Sidebar ── */

    /* ── Synthesize button star style ── */
    #synthesize-btn {
      background: linear-gradient(135deg, #8ab4f8, #c58af9);
      border: none;
    }

    #synthesize-btn:hover {
      background: linear-gradient(135deg, #6ea3f7, #b070f0);
    }

    #synthesize-btn.loading svg {
      animation: spin 0.8s linear infinite;
    }

    #sessions-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(var(--sidebar-width, 280px), var(--sidebar-max, 280px));
      max-width: var(--sidebar-max, 280px);
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    #sessions-sidebar.no-transition {
      transition: none !important;
    }

    body.sidebar-collapsed #prompt-area {
      left: var(--sidebar-rail, 40px);
    }

    body.sidebar-collapsed #sessions-sidebar {
      width: var(--sidebar-rail, 40px) !important;
    }

    body.sidebar-collapsed #sessions-sidebar .sessions-title,
    body.sidebar-collapsed #sessions-sidebar #new-session,
    body.sidebar-collapsed #sessions-sidebar .sessions-list,
    body.sidebar-collapsed #sessions-sidebar .sessions-footer {
      display: none;
    }

    body.sidebar-collapsed #sessions-sidebar .sessions-header {
      border-bottom: none;
      padding: 6px;
      justify-content: center;
      align-items: center;
      gap: 0;
    }

    body.sidebar-collapsed #sessions-sidebar .sessions-actions {
      gap: 4px;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    body.sidebar-collapsed #sessions-sidebar #toggle-sessions,
    body.sidebar-collapsed #sessions-sidebar #collapsed-new-session,
    body.sidebar-collapsed #sessions-sidebar #settings-btn {
      width: 32px;
      height: 32px;
      margin: 0 auto;
      padding: 0;
    }

    body.sidebar-collapsed #sessions-sidebar #collapsed-new-session {
      display: inline-flex;
    }

    /* In collapsed column layout: toggle first, then new-session, then settings */
    body.sidebar-collapsed #sessions-sidebar #settings-btn {
      order: 10;
    }

    .sessions-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
    }

    .sessions-title {
      font-weight: 600;
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .sessions-actions {
      display: flex;
      gap: 4px;
    }

    .sessions-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      border-radius: 6px;
      height: 32px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-sizing: border-box;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }

    .sessions-btn:hover {
      background: var(--accent-dim);
      border-color: transparent;
      color: var(--text-primary);
    }

    .sessions-btn svg,
    .sessions-icon-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .sessions-icon-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-sizing: border-box;
      transition: background 0.12s, color 0.12s, border-color 0.12s;
    }

    .sessions-icon-btn:hover {
      background: var(--accent-dim);
      border-color: transparent;
      color: var(--text-primary);
    }

    .collapsed-only {
      display: none;
    }

    .sessions-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .session-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      transition: background 0.12s, color 0.12s;
    }

    .session-item:hover {
      background: var(--accent-dim);
      color: var(--text-primary);
    }

    .session-item.active {
      background: var(--accent-glow);
      color: var(--text-primary);
    }

    .sessions-footer {
      padding: 8px;
      border-top: 1px solid var(--border);
      display: flex;
      align-items: center;
      gap: 6px;
    }

    .sessions-footer .sessions-btn {
      flex: 1;
    }

    .sessions-footer .sessions-icon-btn {
      flex-shrink: 0;
    }

    /* ── Settings Overlay ── */
    #settings-overlay {
      display: none;
      position: fixed;
      inset: 0;
      z-index: 9000;
      background: rgba(0, 0, 0, 0.55);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      align-items: center;
      justify-content: center;
      animation: settingsFadeIn 0.15s ease;
    }

    #settings-overlay.visible {
      display: flex;
    }

    @keyframes settingsFadeIn {
      from {
        opacity: 0;
      }

      to {
        opacity: 1;
      }
    }

    @keyframes settingsSlideIn {
      from {
        opacity: 0;
        transform: translateY(12px) scale(0.98);
      }

      to {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }

    .settings-panel {
      width: 520px;
      max-width: 90vw;
      max-height: 80vh;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius-lg);
      box-shadow: 0 24px 64px rgba(0, 0, 0, 0.6);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      animation: settingsSlideIn 0.2s ease;
    }

    .settings-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
    }

    .settings-header h2 {
      font-size: 15px;
      font-weight: 600;
      color: var(--text-primary);
      margin: 0;
    }

    .settings-close-btn {
      width: 28px;
      height: 28px;
      border: none;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.12s, color 0.12s;
    }

    .settings-close-btn:hover {
      background: var(--accent-dim);
      color: var(--text-primary);
    }

    .settings-close-btn svg {
      width: 16px;
      height: 16px;
    }

    .settings-body {
      flex: 1;
      overflow-y: auto;
      padding: 20px;
    }

    .settings-section {
      margin-bottom: 24px;
    }

    .settings-section:last-child {
      margin-bottom: 0;
    }

    .settings-section-title {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      margin-bottom: 12px;
    }

    .settings-field {
      margin-bottom: 14px;
    }

    .settings-field:last-child {
      margin-bottom: 0;
    }

    .settings-label {
      display: block;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .settings-input {
      width: 100%;
      height: 36px;
      background: var(--surface-high);
      border: 1px solid var(--border);
      border-radius: var(--radius-sm);
      color: var(--text-primary);
      padding: 0 12px;
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s;
    }

    .settings-input:focus {
      border-color: var(--accent);
    }

    .settings-input::placeholder {
      color: var(--text-muted);
    }

    /* Provider grid for workspace */
    .workspace-provider-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .workspace-provider-item {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-high);
      cursor: pointer;
      transition: border-color 0.15s, background 0.15s;
    }

    .workspace-provider-item:hover {
      border-color: var(--text-muted);
    }

    .workspace-provider-item.checked {
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .workspace-provider-item input[type="checkbox"] {
      appearance: none;
      -webkit-appearance: none;
      width: 16px;
      height: 16px;
      border: 1.5px solid var(--text-muted);
      border-radius: 4px;
      background: transparent;
      cursor: pointer;
      flex-shrink: 0;
      position: relative;
      transition: background 0.12s, border-color 0.12s;
    }

    .workspace-provider-item input[type="checkbox"]:checked {
      background: var(--accent);
      border-color: var(--accent);
    }

    .workspace-provider-item input[type="checkbox"]:checked::after {
      content: '';
      position: absolute;
      left: 4px;
      top: 1px;
      width: 5px;
      height: 9px;
      border: solid var(--bg);
      border-width: 0 2px 2px 0;
      transform: rotate(45deg);
    }

    .workspace-provider-item .provider-name {
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      transition: color 0.12s;
    }

    .workspace-provider-item.checked .provider-name {
      color: var(--text-primary);
    }

    .settings-footer {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
      padding: 14px 20px;
      border-top: 1px solid var(--border);
    }

    .settings-btn-secondary {
      height: 34px;
      padding: 0 16px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .settings-btn-secondary:hover {
      border-color: var(--text-muted);
      color: var(--text-primary);
    }

    .settings-btn-primary {
      height: 34px;
      padding: 0 20px;
      border-radius: var(--radius-sm);
      border: none;
      background: var(--accent);
      color: var(--bg);
      font-size: 13px;
      font-weight: 600;
      font-family: var(--font);
      cursor: pointer;
      transition: background 0.15s;
    }

    .settings-btn-primary:hover {
      background: var(--accent-hover);
    }

    .settings-saved-indicator {
      font-size: 12px;
      color: #34a853;
      opacity: 0;
      transition: opacity 0.2s;
      margin-right: auto;
    }

    .settings-saved-indicator.show {
      opacity: 1;
    }

    /* Workspace presets */
    .workspace-presets {
      display: flex;
      gap: 6px;
      margin-bottom: 12px;
      flex-wrap: wrap;
    }

    .workspace-preset-btn {
      height: 28px;
      padding: 0 10px;
      border-radius: 6px;
      border: 1px solid var(--border);
      background: var(--surface-high);
      color: var(--text-muted);
      font-size: 11px;
      font-weight: 500;
      font-family: var(--font);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;

<script>
  (() => {
    const root = document.documentElement;
    const body = document.body;
    const promptArea = document.getElementById("prompt-area");

    if (!promptArea) {
      return;
    }

    const getViewportHeight = () =>
      window.visualViewport?.height ?? document.documentElement.clientHeight;

    const updateOverflowState = () => {
      const viewportHeight = getViewportHeight();
      const styles = window.getComputedStyle(body);
      const paddingTop = parseFloat(styles.paddingTop) || 0;
      const paddingBottom = parseFloat(styles.paddingBottom) || 0;
      const totalHeight =
        promptArea.getBoundingClientRect().height + paddingTop + paddingBottom;

      body.classList.toggle(
        "is-overflowing",
        totalHeight - viewportHeight > 1,
      );
    };

    const setViewportHeight = () => {
      const viewportHeight = getViewportHeight();
      root.style.setProperty(
        "--app-viewport-height",
        `${Math.max(viewportHeight, 1) * 0.01}px`,
      );
      updateOverflowState();
    };

    setViewportHeight();

    const handleViewportChange = () => setViewportHeight();

    window.visualViewport?.addEventListener("resize", handleViewportChange);
    window.visualViewport?.addEventListener("scroll", handleViewportChange);
    window.addEventListener("resize", handleViewportChange, { passive: true });
    window.addEventListener("orientationchange", handleViewportChange);

    if ("ResizeObserver" in window) {
      const resizeObserver = new ResizeObserver(updateOverflowState);
      resizeObserver.observe(promptArea);

      window.addEventListener(
        "pagehide",
        () => {
          window.visualViewport?.removeEventListener("resize", handleViewportChange);
          window.visualViewport?.removeEventListener("scroll", handleViewportChange);
          window.removeEventListener("resize", handleViewportChange);
          window.removeEventListener("orientationchange", handleViewportChange);
          resizeObserver.disconnect();
        },
        { once: true },
      );
    } else {
      window.addEventListener(
        "pagehide",
        () => {
          window.visualViewport?.removeEventListener("resize", handleViewportChange);
          window.visualViewport?.removeEventListener("scroll", handleViewportChange);
          window.removeEventListener("resize", handleViewportChange);
          window.removeEventListener("orientationchange", handleViewportChange);
        },
        { once: true },
      );
    }
  })();
</script>
