<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <meta http-equiv="Content-Security-Policy"
    content="default-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com;" />
  <title>Multi-LLM Interface</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      color-scheme: dark;

      /* ── Surface palette ── */
      --bg: #0e0e10;
      --surface: #18181b;
      --surface-high: #1f1f23;
      --surface-variant: #27272a;

      /* ── Text ── */
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --text-muted: #71717a;

      /* ── Accent ── */
      --accent: #8ab4f8;
      --accent-hover: #6ea3f7;
      --accent-dim: rgba(138, 180, 248, 0.12);
      --accent-glow: rgba(138, 180, 248, 0.20);

      /* ── Borders ── */
      --border: #27272a;
      --border-subtle: rgba(255, 255, 255, 0.06);

      /* ── Radii ── */
      --radius-sm: 8px;
      --radius-md: 12px;
      --radius-lg: 16px;

      /* ── Layout ── */
      --app-viewport-height: 1vh;
      --sidebar-width: 280px;
      --sidebar-max: 280px;
      --sessions-button-size: 36px;
      --sessions-header-pad: 8px;
      --sidebar-rail: calc(var(--sessions-button-size) + (2 * var(--sessions-header-pad)));
      --header-height: 44px;

      /* ── Typography ── */
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      align-items: center;
      height: 100vh;
      min-height: 100vh;
      padding: 0;
      background: var(--bg);
      font-family: var(--font);
      color: var(--text-primary);
      transition: justify-content 0.2s ease;
      overflow: hidden;
    }

    body.is-overflowing {
      justify-content: flex-start;
    }

    @supports (height: 100dvh) {
      body {
        min-height: 100dvh;
        min-height: calc(var(--app-viewport-height) * 100);
      }
    }

    /* ── Reduced motion ── */
    @media (prefers-reduced-motion: reduce) {

      *,
      *::before,
      *::after {
        animation-duration: 0.01ms !important;
        transition-duration: 0.01ms !important;
      }
    }

    /* ── Provider Toggles ── */
    .provider-toggle {
      flex: 1;
      min-height: 36px;
      font-size: 13px;
      font-weight: 500;
      padding: 6px 8px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--text-muted);
      cursor: pointer;
      transition: color 0.15s, border-color 0.15s, background 0.15s;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .provider-toggle.active {
      color: var(--text-primary);
      border-color: var(--accent);
      background: var(--accent-dim);
    }

    .provider-toggle:hover {
      color: var(--text-secondary);
      border-color: var(--text-muted);
    }

    .provider-toggle.active:hover {
      color: var(--text-primary);
      border-color: var(--accent);
    }

    /* Research provider accent */
    .provider-toggle.provider-research.active {
      border-color: #34a853;
      background: rgba(52, 168, 83, 0.10);
    }

    .provider-toggle.provider-research:hover {
      border-color: rgba(52, 168, 83, 0.5);
    }

    .provider-toggle svg {
      width: 14px;
      height: 14px;
      flex-shrink: 0;
    }

    /* Provider divider */
    .provider-divider {
      width: 1px;
      height: 24px;
      background: var(--border);
      margin: 0 4px;
      align-self: center;
    }

    /* ── Prompt Area ── */
    #prompt-area {
      position: fixed;
      left: min(var(--sidebar-width, 280px), var(--sidebar-max, 280px));
      right: 0;
      bottom: 0;
      display: flex;
      gap: 10px;
      padding: 12px;
      min-height: 110px;
      align-items: stretch;
      width: auto;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-direction: column;
    }

    #prompt-area.drag-active {
      border-color: var(--accent);
      background: linear-gradient(135deg,
          var(--accent-dim),
          transparent);
    }

    #prompt-input {
      flex: 1;
      padding: 12px 14px;
      font-size: 15px;
      font-family: var(--font);
      line-height: 1.6;
      background: var(--surface-high);
      border: 1px solid var(--border);
      border-radius: var(--radius-md);
      color: var(--text-primary);
      resize: none;
      transition: border-color 0.15s;
    }

    #prompt-input::placeholder {
      color: var(--text-muted);
    }

    #prompt-input:focus {
      outline: none;
      border-color: var(--accent);
    }

    /* ── Button Group ── */
    .button-group {
      display: flex;
      flex-direction: column;
      gap: 8px;
      width: 180px;
    }

    .dropdown,
    .prompt-picker {
      width: 100%;
      position: relative;
    }

    button {
      font-family: inherit;
    }

    #dropdown-button,
    .utility-button {
      width: 100%;
      min-height: 40px;
      font-size: 13px;
      font-weight: 600;
      padding: 8px 12px;
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      background: var(--surface-high);
      color: var(--text-secondary);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s, background 0.15s;
      text-align: center;
    }

    #dropdown-button:hover,
    .utility-button:hover {
      border-color: var(--accent);
      color: var(--text-primary);
    }

    .utility-button {
      background: var(--accent);
      color: var(--bg);
      border-color: transparent;
      font-weight: 600;
    }

    .utility-button:hover {
      background: var(--accent-hover);
      color: var(--bg);
    }

    .dropdown-content {
      display: none;
      position: absolute;
      top: calc(100% + 6px);
      left: 0;
      width: 100%;
      background-color: var(--surface-high);
      border-radius: var(--radius-sm);
      border: 1px solid var(--border);
      padding: 6px;
      max-height: 200px;
      overflow-y: auto;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
      z-index: 1000;
    }

    .dropdown-item {
      width: 100%;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 500;
      font-size: 13px;
      color: var(--text-secondary);
      transition: background-color 0.12s, color 0.12s;
    }

    .dropdown-item:hover {
      background-color: var(--accent-dim);
      color: var(--text-primary);
    }

    .show {
      display: block;
    }

    /* ── Chat Header ── */
    .chat-header {
      display: flex;
      gap: 6px;
      align-items: center;
      margin-bottom: 4px;
    }

    /* ── Chat Input Row ── */
    .chat-input-row {
      display: flex;
      gap: 12px;
      align-items: stretch;
    }

    /* ── Sessions Sidebar ── */
    #sessions-sidebar {
      position: fixed;
      top: 0;
      left: 0;
      bottom: 0;
      width: min(var(--sidebar-width, 280px), var(--sidebar-max, 280px));
      max-width: var(--sidebar-max, 280px);
      background: var(--surface);
      border-right: 1px solid var(--border);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      z-index: 10;
    }

    #sessions-sidebar.no-transition {
      transition: none !important;
    }

    body.sidebar-collapsed #prompt-area {
      left: var(--sidebar-rail, 40px);
    }

    body.sidebar-collapsed #sessions-sidebar {
      width: var(--sidebar-rail, 40px) !important;
    }

    body.sidebar-collapsed #sessions-sidebar .sessions-title,
    body.sidebar-collapsed #sessions-sidebar #new-session,
    body.sidebar-collapsed #sessions-sidebar .sessions-list,
    body.sidebar-collapsed #sessions-sidebar .sessions-footer {
      display: none;
    }

    body.sidebar-collapsed #sessions-sidebar .sessions-header {
      border-bottom: none;
      padding: 6px;
      justify-content: center;
      align-items: center;
      gap: 0;
    }

    body.sidebar-collapsed #sessions-sidebar .sessions-actions {
      gap: 4px;
      flex-direction: column;
      align-items: center;
      width: 100%;
    }

    body.sidebar-collapsed #sessions-sidebar #toggle-sessions,
    body.sidebar-collapsed #sessions-sidebar #collapsed-new-session {
      width: 32px;
      height: 32px;
      margin: 0 auto;
      padding: 0;
    }

    body.sidebar-collapsed #sessions-sidebar #collapsed-new-session {
      display: inline-flex;
    }

    .sessions-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 10px 10px;
      border-bottom: 1px solid var(--border);
    }

    .sessions-title {
      font-weight: 600;
      font-size: 12px;
      color: var(--text-muted);
      text-transform: uppercase;
      letter-spacing: 0.06em;
    }

    .sessions-actions {
      display: flex;
      gap: 4px;
    }

    .sessions-btn {
      border: 1px solid var(--border);
      background: transparent;
      color: var(--text-secondary);
      border-radius: 6px;
      height: 32px;
      padding: 0 10px;
      font-size: 12px;
      font-weight: 500;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      box-sizing: border-box;
      transition: background 0.12s, border-color 0.12s, color 0.12s;
    }

    .sessions-btn:hover {
      background: var(--accent-dim);
      border-color: transparent;
      color: var(--text-primary);
    }

    .sessions-btn svg,
    .sessions-icon-btn svg {
      width: 16px;
      height: 16px;
      flex-shrink: 0;
    }

    .sessions-icon-btn {
      border: 1px solid transparent;
      background: transparent;
      color: var(--text-muted);
      border-radius: 6px;
      width: 32px;
      height: 32px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-sizing: border-box;
      transition: background 0.12s, color 0.12s;
    }

    .sessions-icon-btn:hover {
      background: var(--accent-dim);
      color: var(--text-primary);
    }

    .collapsed-only {
      display: none;
    }

    .sessions-list {
      flex: 1;
      overflow-y: auto;
      padding: 6px;
    }

    .session-item {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 8px 10px;
      border-radius: 6px;
      cursor: pointer;
      color: var(--text-secondary);
      font-size: 13px;
      transition: background 0.12s, color 0.12s;
    }

    .session-item:hover {
      background: var(--accent-dim);
      color: var(--text-primary);
    }

    .session-item.active {
      background: var(--accent-glow);
      color: var(--text-primary);
    }

    .sessions-footer {
      padding: 8px;
      border-top: 1px solid var(--border);
    }

    .sessions-footer .sessions-btn {
      width: 100%;
    }

    /* ── View Headers ── */
    #view-headers-container {
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: var(--header-height);
      pointer-events: none;
      z-index: 100;
    }

    .view-header {
      position: absolute;
      top: 0;
      height: var(--header-height);
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 8px;
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      border-right: 1px solid var(--border);
      pointer-events: auto;
      box-sizing: border-box;
    }

    .view-header input {
      flex: 1;
      height: 28px;
      background: var(--surface-high);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-primary);
      padding: 0 10px;
      font-size: 13px;
      font-family: var(--font);
      outline: none;
      transition: border-color 0.15s;
    }

    .view-header input:focus {
      border-color: var(--accent);
    }

    .view-header button {
      height: 28px;
      padding: 0 10px;
      background: var(--surface-high);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text-secondary);
      font-size: 12px;
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .view-header button:hover {
      color: var(--text-primary);
      border-color: var(--accent);
    }
  </style>
  <script>
    // Ensure sidebar uses the CSS default width if a larger value was stored earlier
    (function () {
      try {
        var CSS_DEFAULT = 280;
        var key = 'sessionsSidebar.width';
        var raw = localStorage.getItem(key);
        var n = raw ? parseInt(raw, 10) : NaN;
        if (!isFinite(n) || n > CSS_DEFAULT) {
          localStorage.setItem(key, String(CSS_DEFAULT));
        }
      } catch (e) {
        // noop
      }
    })();
  </script>
  <script type="module" src="./dist/renderer.js"></script>
</head>

<body class="sidebar-collapsed">
  <aside id="sessions-sidebar">
    <div class="sessions-header">
      <div class="sessions-title">Sessions</div>
      <div class="sessions-actions">
        <button class="sessions-btn" id="new-session">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
          New
        </button>
        <button class="sessions-icon-btn" id="toggle-sessions" title="Toggle sidebar" aria-label="Toggle sidebar">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M3 3h7v18H3z" />
            <path d="M14 9l3 3-3 3" />
          </svg>
        </button>
        <button class="sessions-icon-btn collapsed-only" id="collapsed-new-session" title="New session"
          aria-label="New session">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
            stroke-linejoin="round">
            <path d="M12 5v14" />
            <path d="M5 12h14" />
          </svg>
        </button>
      </div>
    </div>
    <div class="sessions-list" id="sessions-list" role="listbox" tabindex="0"></div>
    <div class="sessions-footer"></div>
  </aside>

  <div id="view-headers-container"></div>
  <div id="prompt-area">
    <div class="chat-header">
      <button class="provider-toggle" data-provider="chatgpt">ChatGPT</button>
      <button class="provider-toggle" data-provider="gemini">Gemini</button>
      <button class="provider-toggle" data-provider="perplexity">Perplexity</button>
      <button class="provider-toggle" data-provider="claude">Claude</button>
      <button class="provider-toggle" data-provider="grok">Grok</button>
      <button class="provider-toggle" data-provider="deepseek">DeepSeek</button>
      <span class="provider-divider"></span>
      <button class="provider-toggle provider-research" data-provider="googleai">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <circle cx="11" cy="11" r="8" />
          <path d="m21 21-4.3-4.3" />
        </svg>
        Google
      </button>
      <button class="provider-toggle provider-research" data-provider="reddit">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
          stroke-linejoin="round">
          <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z" />
        </svg>
        Reddit
      </button>
    </div>
    <div class="chat-input-row">
      <textarea id="prompt-input" rows="3" placeholder="Press Ctrl + Enter to send prompt"></textarea>
      <div class="button-group">
        <button class="utility-button" id="copy-all-answers">
          Copy All Answers
        </button>
      </div>
    </div>
  </div>
</body>
<script>
  (() => {
    const root = document.documentElement;
    const body = document.body;
    const promptArea = document.getElementById("prompt-area");

    if (!promptArea) {
      return;
    }

    const getViewportHeight = () =>
      window.visualViewport?.height ?? document.documentElement.clientHeight;

    const updateOverflowState = () => {
      const viewportHeight = getViewportHeight();
      const styles = window.getComputedStyle(body);
      const paddingTop = parseFloat(styles.paddingTop) || 0;
      const paddingBottom = parseFloat(styles.paddingBottom) || 0;
      const totalHeight =
        promptArea.getBoundingClientRect().height + paddingTop + paddingBottom;

      body.classList.toggle(
        "is-overflowing",
        totalHeight - viewportHeight > 1,
      );
    };

    const setViewportHeight = () => {
      const viewportHeight = getViewportHeight();
      root.style.setProperty(
        "--app-viewport-height",
        `${Math.max(viewportHeight, 1) * 0.01}px`,
      );
      updateOverflowState();
    };

    setViewportHeight();

    const handleViewportChange = () => setViewportHeight();

    window.visualViewport?.addEventListener("resize", handleViewportChange);
    window.visualViewport?.addEventListener("scroll", handleViewportChange);
    window.addEventListener("resize", handleViewportChange, { passive: true });
    window.addEventListener("orientationchange", handleViewportChange);

    if ("ResizeObserver" in window) {
      const resizeObserver = new ResizeObserver(updateOverflowState);
      resizeObserver.observe(promptArea);

      window.addEventListener(
        "pagehide",
        () => {
          window.visualViewport?.removeEventListener("resize", handleViewportChange);
          window.visualViewport?.removeEventListener("scroll", handleViewportChange);
          window.removeEventListener("resize", handleViewportChange);
          window.removeEventListener("orientationchange", handleViewportChange);
          resizeObserver.disconnect();
        },
        { once: true },
      );
    } else {
      window.addEventListener(
        "pagehide",
        () => {
          window.visualViewport?.removeEventListener("resize", handleViewportChange);
          window.visualViewport?.removeEventListener("scroll", handleViewportChange);
          window.removeEventListener("resize", handleViewportChange);
          window.removeEventListener("orientationchange", handleViewportChange);
        },
        { once: true },
      );
    }
  })();
</script>
<script type="module" src="./dist/dropdown.js"></script>

</html>
