<!doctype html>
<html>

<head>
  <meta charset="utf-8" />
  <title>Sessions</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0e0e10;
      --surface: #18181b;
      --surface-high: #1f1f23;
      --text-primary: #f4f4f5;
      --text-secondary: #a1a1aa;
      --accent-dim: rgba(138, 180, 248, 0.12);
      --border: #27272a;
      --font: "Inter", system-ui, -apple-system, sans-serif;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: var(--surface);
      color: var(--text-primary);
      font-family: var(--font);
    }

    .sessions-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px 12px;
      border-bottom: 1px solid var(--border);
    }

    .sessions-title {
      font-weight: 600;
      font-size: 13px;
      color: var(--text-secondary);
      letter-spacing: 0.01em;
    }

    .sessions-btn {
      border: 1px solid var(--border);
      background: var(--surface-high);
      color: var(--text-secondary);
      border-radius: 6px;
      padding: 6px 8px;
      font-size: 12px;
      font-family: var(--font);
      cursor: pointer;
      transition: border-color 0.15s, color 0.15s;
    }

    .sessions-btn:hover {
      border-color: rgba(138, 180, 248, 0.5);
      color: var(--text-primary);
    }

    .sessions-list {
      height: calc(100vh - 92px);
      overflow: auto;
      padding: 6px;
    }

    .session-item {
      padding: 8px 10px;
      border-radius: 6px;
      color: var(--text-secondary);
      cursor: pointer;
      font-size: 13px;
      transition: background 0.12s, color 0.12s;
    }

    .session-item:hover {
      background: var(--accent-dim);
      color: var(--text-primary);
    }

    .sessions-footer {
      border-top: 1px solid var(--border);
      padding: 8px;
    }

    .sessions-footer .sessions-btn {
      width: 100%;
    }
  </style>
  <script type="module" src="../dist/sessionSidebarWindow.js"></script>
</head>

<body>
  <div class="sessions-header">
    <div class="sessions-title">Recent sessions</div>
    <div></div>
  </div>
  <div class="sessions-list" id="sessions-list"></div>
  <div class="sessions-footer"></div>
</body>

</html>
