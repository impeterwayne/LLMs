<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Synthesis — LLM God</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet" />
    <style>
        :root {
            --bg: #0c0c0e;
            --surface: #141416;
            --surface-high: #1c1c20;
            --border: #27272a;
            --text: #e4e4e7;
            --text-secondary: #a1a1aa;
            --text-dim: #71717a;
            --accent: #58aefd;
            --accent-dim: rgba(88, 174, 253, 0.12);
            --accent-glow: rgba(88, 174, 253, 0.25);
            --error: #f87171;
            --success: #4ade80;
            --font: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            --mono: 'JetBrains Mono', 'Cascadia Code', 'Fira Code', monospace;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: var(--bg);
            color: var(--text);
            font-family: var(--font);
            font-size: 14px;
            line-height: 1.65;
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        /* ── Header ── */
        .header {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 20px;
            background: var(--surface);
            border-bottom: 1px solid var(--border);
            flex-shrink: 0;
            -webkit-app-region: drag;
        }

        .header-icon {
            width: 20px;
            height: 20px;
            color: var(--accent);
            flex-shrink: 0;
        }

        .header-title {
            font-size: 13px;
            font-weight: 600;
            color: var(--accent);
            letter-spacing: 0.3px;
        }

        .header-status {
            margin-left: auto;
            display: flex;
            align-items: center;
            gap: 6px;
            -webkit-app-region: no-drag;
        }

        .status-dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background: var(--text-dim);
            flex-shrink: 0;
            transition: background 0.3s;
        }

        .status-dot.running {
            background: var(--accent);
            animation: pulse 1.5s ease-in-out infinite;
        }

        .status-dot.done {
            background: var(--success);
        }

        .status-dot.error {
            background: var(--error);
        }

        @keyframes pulse {

            0%,
            100% {
                opacity: 1;
            }

            50% {
                opacity: 0.4;
            }
        }

        .status-label {
            font-size: 11px;
            color: var(--text-dim);
            font-weight: 500;
        }

        .copy-btn {
            -webkit-app-region: no-drag;
            display: flex;
            align-items: center;
            gap: 5px;
            height: 28px;
            padding: 0 10px;
            border-radius: 6px;
            border: 1px solid var(--border);
            background: transparent;
            color: var(--text-dim);
            font-size: 11px;
            font-weight: 500;
            font-family: var(--font);
            cursor: pointer;
            transition: border-color 0.15s, color 0.15s, background 0.15s;
        }

        .copy-btn:hover {
            border-color: var(--accent);
            color: var(--text);
            background: var(--accent-dim);
        }

        .copy-btn.copied {
            border-color: var(--success);
            color: var(--success);
        }

        .copy-btn svg {
            width: 14px;
            height: 14px;
        }

        /* ── Content ── */
        #content {
            flex: 1;
            overflow-y: auto;
            padding: 24px;
            scroll-behavior: smooth;
        }

        #content::-webkit-scrollbar {
            width: 5px;
        }

        #content::-webkit-scrollbar-track {
            background: transparent;
        }

        #content::-webkit-scrollbar-thumb {
            background: var(--border);
            border-radius: 3px;
        }

        /* ── Synthesis Entry ── */
        .synth-entry {
            margin-bottom: 32px;
            animation: fadeIn 0.3s ease;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(8px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .entry-header {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 16px;
            padding-bottom: 10px;
            border-bottom: 1px solid var(--border);
        }

        .entry-badge {
            font-size: 10px;
            font-weight: 600;
            letter-spacing: 0.5px;
            text-transform: uppercase;
            color: var(--accent);
            background: var(--accent-dim);
            padding: 3px 8px;
            border-radius: 4px;
        }

        .entry-meta {
            font-size: 11px;
            color: var(--text-dim);
        }

        .entry-loading {
            display: flex;
            align-items: center;
            gap: 8px;
            color: var(--text-dim);
            font-size: 13px;
            padding: 12px 0;
        }

        .spinner {
            width: 14px;
            height: 14px;
            border: 2px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 0.7s linear infinite;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }

        /* ── Markdown Rendering ── */
        .md-body {
            color: var(--text);
            font-size: 14px;
            line-height: 1.7;
        }

        .md-body h1 {
            font-size: 22px;
            font-weight: 700;
            margin: 24px 0 12px;
            color: var(--accent);
        }

        .md-body h2 {
            font-size: 18px;
            font-weight: 600;
            margin: 20px 0 10px;
            color: var(--accent);
            border-bottom: 1px solid var(--border);
            padding-bottom: 6px;
        }

        .md-body h3 {
            font-size: 16px;
            font-weight: 600;
            margin: 16px 0 8px;
            color: var(--accent);
        }

        .md-body h4 {
            font-size: 14px;
            font-weight: 600;
            margin: 12px 0 6px;
            color: var(--accent);
            opacity: 0.8;
        }

        .md-body p {
            margin: 0 0 12px;
        }

        .md-body a {
            color: var(--accent);
            text-decoration: none;
        }

        .md-body a:hover {
            text-decoration: underline;
        }

        .md-body strong {
            font-weight: 600;
            color: var(--accent);
        }

        .md-body em {
            font-style: italic;
            color: var(--text-secondary);
        }

        .md-body ul,
        .md-body ol {
            margin: 0 0 12px;
            padding-left: 24px;
        }

        .md-body li {
            margin-bottom: 4px;
        }

        .md-body li::marker {
            color: var(--accent);
        }

        .md-body blockquote {
            border-left: 3px solid var(--accent);
            margin: 12px 0;
            padding: 8px 16px;
            background: var(--accent-dim);
            border-radius: 0 6px 6px 0;
            color: var(--text-secondary);
        }

        .md-body hr {
            border: none;
            border-top: 1px solid var(--border);
            margin: 20px 0;
        }

        .md-body code {
            font-family: var(--mono);
            font-size: 12.5px;
            background: var(--accent-dim);
            color: #c084fc;
            padding: 2px 6px;
            border-radius: 4px;
            border: 1px solid rgba(88, 174, 253, 0.25);
        }

        .md-body pre {
            background: var(--surface);
            border: 1px solid var(--border);
            border-left: 3px solid var(--accent);
            border-radius: 8px;
            padding: 14px 16px;
            margin: 12px 0;
            overflow-x: auto;
            position: relative;
        }

        .md-body pre code {
            background: none;
            border: none;
            padding: 0;
            color: var(--text);
            font-size: 12.5px;
            line-height: 1.5;
        }

        .md-body kbd {
            font-family: var(--mono);
            font-size: 12px;
            background: var(--surface-high);
            color: #c084fc;
            padding: 2px 7px;
            border-radius: 4px;
            border: 1px solid var(--border);
            box-shadow: 0 1px 0 var(--border);
        }

        .md-body table {
            width: 100%;
            border-collapse: collapse;
            margin: 12px 0;
            font-size: 13px;
        }

        .md-body th {
            text-align: left;
            padding: 8px 12px;
            background: var(--surface-high);
            border: 1px solid var(--border);
            font-weight: 600;
            color: var(--text);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }

        .md-body td {
            padding: 8px 12px;
            border: 1px solid var(--border);
            color: var(--text-secondary);
        }

        .md-body tr:hover td {
            background: var(--accent-dim);
        }

        /* ── Empty state ── */
        .empty-state {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--text-dim);
            gap: 8px;
        }

        .empty-state svg {
            width: 32px;
            height: 32px;
            color: var(--border);
        }

        .empty-state p {
            font-size: 13px;
        }

        .empty-state kbd {
            background: var(--surface-high);
            border: 1px solid var(--border);
            padding: 2px 8px;
            border-radius: 4px;
            font-size: 11px;
            font-family: var(--mono);
            color: var(--text-secondary);
        }
    </style>
</head>

<body>
    <div class="header">
        <svg class="header-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
            stroke-linecap="round" stroke-linejoin="round">
            <path
                d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
        </svg>
        <span class="header-title">Synthesis</span>
        <button class="copy-btn" id="copy-btn" title="Copy answer">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                stroke-linejoin="round">
                <rect x="9" y="9" width="13" height="13" rx="2" ry="2" />
                <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1" />
            </svg>
            <span id="copy-btn-label">Copy</span>
        </button>
        <div class="header-status">
            <span class="status-dot" id="status-dot"></span>
            <span class="status-label" id="status-label">Ready</span>
        </div>
    </div>

    <div id="content">
        <div class="empty-state" id="empty-state">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                stroke-linejoin="round">
                <path
                    d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z" />
            </svg>
            <p>Press <kbd>Ctrl+S</kbd> to synthesize answers</p>
        </div>
    </div>

    <!-- Load marked from CDN as reliable fallback -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <script>
        const { ipcRenderer } = require("electron");

        // Get marked — prefer CDN global, fallback to require
        let parseMd;
        if (typeof window.marked !== "undefined") {
            // CDN loaded version
            const m = window.marked;
            if (typeof m.setOptions === "function") m.setOptions({ breaks: true, gfm: true });
            parseMd = (text) => (typeof m.parse === "function" ? m.parse(text) : m(text));
            console.log("[SynthesisWindow] Using marked from CDN");
        } else {
            try {
                const path = require("path");
                const markedMod = require(path.join(process.cwd(), "node_modules", "marked"));
                const fn = markedMod.marked || markedMod;
                if (typeof fn.setOptions === "function") fn.setOptions({ breaks: true, gfm: true });
                parseMd = (text) => (typeof fn.parse === "function" ? fn.parse(text) : fn(text));
                console.log("[SynthesisWindow] Using marked from node_modules");
            } catch (err) {
                console.error("[SynthesisWindow] marked not available:", err.message);
                parseMd = (text) => {
                    const e = text.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
                    return `<pre style="white-space:pre-wrap;">${e}</pre>`;
                };
            }
        }

        const content = document.getElementById("content");
        const emptyState = document.getElementById("empty-state");
        const statusDot = document.getElementById("status-dot");
        const statusLabel = document.getElementById("status-label");

        let currentEntry = null;
        let currentBuffer = "";
        let currentMdEl = null;
        let renderTimer = null;

        function renderMarkdown() {
            if (currentMdEl && currentBuffer) {
                currentMdEl.innerHTML = parseMd(currentBuffer);
                content.scrollTop = content.scrollHeight;
            }
        }

        function scheduleRender() {
            if (renderTimer) clearTimeout(renderTimer);
            renderTimer = setTimeout(renderMarkdown, 80);
        }

        // New synthesis entry
        ipcRenderer.on("synthesis:entry-start", (_event, { providerCount, timestamp }) => {
            console.log("[SynthesisWindow] entry-start", providerCount, timestamp);
            if (emptyState) emptyState.style.display = "none";

            // Clear previous entries
            content.querySelectorAll(".synth-entry").forEach(el => el.remove());

            statusDot.className = "status-dot running";
            statusLabel.textContent = "Processing...";

            currentBuffer = "";
            currentEntry = document.createElement("div");
            currentEntry.className = "synth-entry";

            const header = document.createElement("div");
            header.className = "entry-header";

            const badge = document.createElement("span");
            badge.className = "entry-badge";
            badge.textContent = `${providerCount} sources`;

            const meta = document.createElement("span");
            meta.className = "entry-meta";
            meta.textContent = timestamp;

            header.appendChild(badge);
            header.appendChild(meta);
            currentEntry.appendChild(header);

            const loading = document.createElement("div");
            loading.className = "entry-loading";
            loading.id = "current-loading";
            loading.innerHTML = '<div class="spinner"></div> Gemini CLI is synthesizing...';
            currentEntry.appendChild(loading);

            currentMdEl = document.createElement("div");
            currentMdEl.className = "md-body";
            currentEntry.appendChild(currentMdEl);

            content.appendChild(currentEntry);
            content.scrollTop = content.scrollHeight;
        });

        // Streaming output from gemini CLI
        ipcRenderer.on("synthesis:output", (_event, text) => {
            console.log("[SynthesisWindow] output chunk:", text.length, "chars");
            currentBuffer += text;
            scheduleRender();
        });

        // Error output
        ipcRenderer.on("synthesis:error", (_event, text) => {
            console.warn("[SynthesisWindow] stderr:", text);
        });

        // Completed
        ipcRenderer.on("synthesis:entry-done", (_event, { code }) => {
            console.log("[SynthesisWindow] entry-done, code:", code);
            const loading = document.getElementById("current-loading");
            if (loading) loading.remove();

            if (renderTimer) clearTimeout(renderTimer);
            renderMarkdown();

            if (code === 0 || code === null) {
                statusDot.className = "status-dot done";
                statusLabel.textContent = "Done";
            } else {
                statusDot.className = "status-dot error";
                statusLabel.textContent = `Error (code ${code})`;
            }

            currentEntry = null;
            currentMdEl = null;
            lastCompletedBuffer = currentBuffer;
            currentBuffer = "";

            setTimeout(() => {
                if (statusDot.className.includes("done")) {
                    statusDot.className = "status-dot";
                    statusLabel.textContent = "Ready";
                }
            }, 4000);
        });

        // Track the last completed buffer for copy
        let lastCompletedBuffer = "";

        // Copy button
        const copyBtn = document.getElementById("copy-btn");
        const copyLabel = document.getElementById("copy-btn-label");
        copyBtn.addEventListener("click", () => {
            if (!lastCompletedBuffer) return;
            navigator.clipboard.writeText(lastCompletedBuffer).then(() => {
                copyBtn.classList.add("copied");
                copyLabel.textContent = "Copied!";
                setTimeout(() => {
                    copyBtn.classList.remove("copied");
                    copyLabel.textContent = "Copy";
                }, 2000);
            });
        });

        // Signal to main process that we're ready to receive events
        console.log("[SynthesisWindow] Sending ready signal");
        ipcRenderer.send("synthesis-window:ready");
    </script>
</body>

</html>
